[versions]
kotlin = "2.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.4.0"
androidKmp = "9.2.1"
vanniktech = "0.36.0"
detekt = "1.23.8"
ktlint = "14.2.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
vanniktech = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }

indexmap-kotlin = { module = "io.github.kotlinmania:indexmap-kotlin", version = "0.1.4" }
icu-decimal-kotlin = { module = "io.github.kotlinmania:icu-decimal-kotlin", version = "0.1.2" }
http-kotlin = { module = "io.github.kotlinmania:http-kotlin", version = "0.1.2" }
bytes-kotlin = { module = "io.github.kotlinmania:bytes-kotlin", version = "0.2.1" }
ratatui-kotlin = { module = "io.github.kotlinmania:ratatui-kotlin", version = "0.1.11" }
crossterm-kotlin = { module = "io.github.kotlinmania:crossterm-kotlin", version = "0.1.6" }
ansi-to-tui-kotlin = { module = "io.github.kotlinmania:ansi-to-tui-kotlin", version = "0.1.4" }
anstyle-kotlin = { module = "io.github.kotlinmania:anstyle-kotlin", version = "0.1.5" }
kasuari-kotlin = { module = "io.github.kotlinmania:kasuari-kotlin", version = "0.1.6" }
roff-kotlin = { module = "io.github.kotlinmania:roff-kotlin", version = "0.1.4" }
cansi-kotlin = { module = "io.github.kotlinmania:cansi-kotlin", version = "0.1.4" }
jwt-kmp = { module = "io.github.kotlinmania:jwt-kmp", version = "0.2.2" }
schemars-kotlin = { module = "io.github.kotlinmania:schemars-kotlin", version = "0.1.2" }
log-kotlin = { module = "io.github.kotlinmania:log-kotlin", version = "0.1.1" }
landlock-kotlin = { module = "io.github.kotlinmania:landlock-kotlin", version = "0.1.1" }
[bundles]
codex-commonMain = [
    "kotlinx-coroutines-core",
    "kotlinx-serialization-core",
    "kotlinx-serialization-json",
    "kotlinx-datetime",
    "collections-immutable",
    "indexmap-kotlin",
    "icu-decimal-kotlin",
    "http-kotlin",
    "bytes-kotlin",
    "ratatui-kotlin",
    "crossterm-kotlin",
    "ansi-to-tui-kotlin",
    "anstyle-kotlin",
    "kasuari-kotlin",
    "roff-kotlin",
    "cansi-kotlin",
    "jwt-kmp",
    "schemars-kotlin",
    "log-kotlin",
    "landlock-kotlin",
]
