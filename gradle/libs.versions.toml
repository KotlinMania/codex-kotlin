[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
time = "0.2.0"
collectionsImmutable = "0.5.2"
ratatui = "0.1.11"
crossterm = "0.1.6"
atomicfu = "0.33.0"
kmIo = "0.1.5"
ktor = "3.5.2"
androidKmp = "9.4.1"
detekt = "1.23.8"
ktlint = "14.2.0"
kotlinxBenchmark = "0.5.0"
http = "0.1.3"
bytes = "0.2.1"
base64 = "0.1.0"
eventsourceStream = "0.1.2"
serde = "0.1.11"
serdeJson = "0.1.1"
ramaHttp = "0.1.0"
ramaHttpBackend = "0.1.1"
tinyHttp = "0.1.1"
unicodeWidth = "0.1.2"
urlencoding = "0.1.1"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
time-kotlin = { module = "io.github.kotlinmania:time-kotlin", version.ref = "time" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
ratatui-kotlin = { module = "io.github.kotlinmania:ratatui-kotlin", version.ref = "ratatui" }
crossterm-kotlin = { module = "io.github.kotlinmania:crossterm-kotlin", version.ref = "crossterm" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
km-io = { module = "io.github.kotlinmania:km-io", version.ref = "kmIo" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
http-kotlin = { module = "io.github.kotlinmania:http-kotlin", version.ref = "http" }
bytes-kotlin = { module = "io.github.kotlinmania:bytes-kotlin", version.ref = "bytes" }
base64-kotlin = { module = "io.github.kotlinmania:base64-kotlin", version.ref = "base64" }
eventsource-stream-kotlin = { module = "io.github.kotlinmania:eventsource-stream-kotlin", version.ref = "eventsourceStream" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
rama-http-kotlin = { module = "io.github.kotlinmania:rama-http-kotlin", version.ref = "ramaHttp" }
rama-http-backend-kotlin = { module = "io.github.kotlinmania:rama-http-backend-kotlin", version.ref = "ramaHttpBackend" }
tiny-http-kotlin = { module = "io.github.kotlinmania:tiny-http-kotlin", version.ref = "tinyHttp" }
unicode-width-kotlin = { module = "io.github.kotlinmania:unicode-width-kotlin", version.ref = "unicodeWidth" }
urlencoding-kotlin = { module = "io.github.kotlinmania:urlencoding-kotlin", version.ref = "urlencoding" }

[bundles]
codex-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "time-kotlin",
  "collections-immutable",
  "ratatui-kotlin",
  "crossterm-kotlin",
  "kotlinx-atomicfu",
  "km-io",
  "ktor-client-core",
  "ktor-client-content-negotiation",
  "ktor-serialization-kotlinx-json",
  "http-kotlin",
  "bytes-kotlin",
  "base64-kotlin",
  "eventsource-stream-kotlin",
  "serde-kotlin",
  "serde-json-kotlin",
  "rama-http-kotlin",
  "rama-http-backend-kotlin",
  "tiny-http-kotlin",
  "unicode-width-kotlin",
  "urlencoding-kotlin",
]
codex-commonTest = [
  "kotlinx-coroutines-test",
  "ktor-client-mock",
]
